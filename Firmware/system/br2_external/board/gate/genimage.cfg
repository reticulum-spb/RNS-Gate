image data.vfat {
	vfat {
		extraargs = "-n 'RNS'"
		files = {
			"rns"
		}
	}
	size = 512M
}

image sdcard.img {
	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1000K # 1MB - 8KB(offset) - 16KB(GPT)
	}

	hdimage {
		partition-table-type = "gpt"
		gpt-location = 1008K # 1MB - 16KB(GPT)
		gpt-no-backup = true
	}

	partition uboot-env {
		image = "uboot-env.bin"
		in-partition-table = false
		offset = 1152K
		size = 128K
	}

	partition rootfs_a {
		offset = 2M
		image = "rootfs.ext4"
	}

	partition rootfs_b {
		image = "rootfs.ext4"
	}

	partition data {
		image = "data.vfat"
	}
}
