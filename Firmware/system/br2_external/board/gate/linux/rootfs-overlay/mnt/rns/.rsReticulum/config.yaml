reticulum:
  share_instance: true
  shared_instance_type: tcp
  shared_instance_port: 37428
  instance_control_port: 37429
  enable_transport: true

api:
  port: 8080
  user: admin
  password: admin

logging:
  level: 5
  timestamps: true

interfaces:
  - type: tcp_server
    name: TCP Server Interface
    enabled: true
    listen_ip: 0.0.0.0
    listen_port: 4242

  - type: tcp_client
    name: Border TCP
    enabled: true
    target_host: 78.37.8.219
    target_port: 2397

 - type: plugin
    name: SPI Lora
    enabled: true
    plugin: sx1262
    mtu: 500
    announce_cap: 10
    config:
      device: /dev/lora0
      frequency: 868672500
      bandwidth: 62500
      spreading_factor: 8
      coding_rate: 7
      tx_power: 8
      rx_preamble_symbols: 65
      tx_preamble_symbols: 18
      sync_word: 5156 # 0x1424
      irq_watchdog_seconds: 60
      hard_reset_after: 2
      tx_timeout_seconds: 120
